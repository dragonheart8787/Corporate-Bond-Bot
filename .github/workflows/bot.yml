name: Telegram Bot 指令監聽（24/7）

on:
  schedule:
    # 每 2 小時嘗試啟動一次，刻意避開整點（整點是 GitHub 排程最壅塞、最容易被丟棄的時段）。
    # 舊版是「每 5 小時一班、每班剛好跑 5 小時」，零重疊：只要 GitHub 丟掉或延遲任何一班，
    # 就會出現數小時沒有 bot 的空窗（2026-10-06 實際發生：10:00、15:00 兩班都沒被建立）。
    # 現在每班 5 小時、每 2 小時一次排程，任何 5 小時窗口內都有 2～3 次機會，
    # 搭配下方 concurrency（不取消執行中的）讓後來的排隊接棒，不會重疊也不會空窗。
    - cron: "17 */2 * * *"
  workflow_dispatch:   # 手動啟動

permissions:
  contents: read

# 全程只允許一個 bot 實例。多個實例會各自 poll getUpdates，同一則 /cb 可能被
# 兩個實例同時取走並各跑一次抓取（還會讓同一組 Telegram session 從兩個 IP 同時連線而被撤銷）。
#
# cancel-in-progress: false —— 新班次「排隊等」，不砍掉執行中的：
#   - 舊版 true 會在新班次一啟動就殺掉舊的，若剛好有人下指令、抓取做到一半就被中斷。
#   - 排隊中的班次在舊的跑滿 5 小時結束後立刻接手，沒有空窗。
#   - GitHub 同一 group 只保留最新的一個排隊，多出來的會顯示 cancelled，那是正常的。
concurrency:
  group: telegram-bot-listener
  cancel-in-progress: false

jobs:
  bot-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 小時（確保不被 6 小時限制強殺）

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 安裝套件
        run: pip install -r requirements.txt

      - name: 🤖 啟動 Telegram Bot 監聽（最多 5 小時）
        env:
          TZ: Asia/Taipei
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # /all、/cb 即時抓取用（與每日 workflow 相同 Secrets）
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_NAME: ${{ secrets.TELEGRAM_CHAT_NAME }}
          # 勿用 secrets.GITHUB_TOKEN（未設定會變空字串，覆寫掉 Runner 內建 token）
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bot_listener.py
