name: Telegram Bot 指令監聽（24/7）

on:
  # 備援（保留）：接力鏈是主要的續命方式，cron 只是在接力鏈斷掉時把 bot 拉起來。
  # GitHub 的 cron 在這個 repo 上大量不觸發（實測 2026-10-07：預期約 11 次、實際只建立 3 個 run），
  # 所以不能只靠它。避開整點（整點最壅塞）。
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:   # 手動啟動，也是 bot 接力觸發下一棒所用的事件
    inputs:
      # 以下三個由 bot 自己接力時帶入，手動啟動請留空。
      handoff_prev_run_id:
        description: "上一棒的 run id（接力用，手動啟動請留空）"
        required: false
        default: ""
      handoff_min_update_id:
        description: "交接水位線：update_id 小於此值視為前一棒已處理（接力用，手動啟動請留空）"
        required: false
        default: ""
      handoff_fail_count:
        description: "連續啟動失敗次數（自救接力用，手動啟動請留空）"
        required: false
        default: ""
      # 供人手動啟動時縮短本棒，部署後用 15~20 分鐘驗證完整交接；留空 = 預設 300 分鐘（接力點在第 285 分鐘）。
      max_runtime_minutes:
        description: "本棒最長運行分鐘數，5~300（留空 = 300；驗證交接用 15~20；接力出去的下一棒一律用預設）"
        required: false
        default: ""

# 最小必要權限：
#   contents: read  — checkout 與讀取 reports/
#   actions: write  — 讓 bot 用 GITHUB_TOKEN 觸發下一棒（bot.yml）與每日報告（daily.yml）的 workflow_dispatch，
#                     同時涵蓋查詢 run 狀態所需的讀取權限
permissions:
  contents: read
  actions: write

# 全程只允許一個 bot 實例。多個實例會各自 poll getUpdates，同一則 /cb 可能被
# 兩個實例同時取走並各跑一次抓取（還會讓同一組 Telegram session 從兩個 IP 同時連線而被撤銷）。
#
# cancel-in-progress: false —— 新班次「排隊等」，不砍掉執行中的：
#   - 舊版 true 會在新班次一啟動就殺掉舊的，若剛好有人下指令、抓取做到一半就被中斷。
#   - 本棒會在結束前 15 分鐘就先觸發下一棒，它在這裡排隊；本棒一結束它立即接手（交接空窗只剩 runner 啟動時間）。
#   - 這裡不做「兩棒同時輪詢」的重疊：同一個 token 同時有兩個 getUpdates 會互砍（409 Conflict），
#     指令可能被處理兩次，session 也可能因多個 IP 同時使用被撤銷。重疊改成「後繼提前排隊」。
#   - GitHub 同一 group 只保留最新的一個排隊，被取代的會顯示 cancelled，那是正常的（cron 與接力同時排隊時會發生）。
#     不論最後留下的是哪一個，同一時間都只會有一個 bot 在跑。
concurrency:
  group: telegram-bot-listener
  cancel-in-progress: false

jobs:
  bot-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 小時（確保不被 6 小時限制強殺）

    steps:
      - name: 📥 Checkout 程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # PyPI 偶發失敗曾讓 bot 整個起不來（run 946），所以重試；最終失敗會明確 fail。
      - name: 📦 安裝套件（含重試）
        run: bash scripts/pip_install_retry.sh requirements.txt

      # step 層級 timeout（310）小於 job 層級（330）：bot 卡死時，是「這一步」先失敗，
      # job 仍活著，後面的自救步驟走一般的 failure 路徑，不必賭 job 逾時後 always() 步驟會不會執行。
      - name: 🤖 啟動 Telegram Bot 監聽（最多 5 小時，結束前自動接力）
        id: bot
        timeout-minutes: 310
        env:
          TZ: Asia/Taipei
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # /all、/cb 即時抓取用（與每日 workflow 相同 Secrets）
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_NAME: ${{ secrets.TELEGRAM_CHAT_NAME }}
          # 接力、觸發每日報告、查詢 run 狀態都用這個 token；權限由上方 permissions 決定。
          # 勿用 secrets.GITHUB_TOKEN（未設定會變空字串，覆寫掉 Runner 內建 token）
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 接力一律回到預設分支的程式碼；萬一事件 payload 沒帶 default_branch 就退回 master
          BOT_RELAY_REF: ${{ github.event.repository.default_branch || 'master' }}
          # 交接資訊（接力啟動時由上一棒帶入；cron / 手動啟動為空）
          BOT_PREV_RUN_ID: ${{ github.event.inputs.handoff_prev_run_id }}
          BOT_MIN_UPDATE_ID: ${{ github.event.inputs.handoff_min_update_id }}
          # 手動啟動時可縮短運行時間（驗證交接用）；留空 = 預設 300 分鐘。範圍 5~300，超出會被夾住並寫 log
          BOT_MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes }}
          # 告警（接力最終失敗、觸發每日報告失敗）送到日報同一個聊天室；未設定則只寫 log
          BOT_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_listener.py

      # 只要 bot 這一步沒有成功（失敗、被取消、前面步驟失敗導致它被略過、整個 job 逾時），就代為排下一棒。
      # 用 always() 而不是 failure()：failure() 在被取消時為 false，自救不會跑。
      # 只用標準函式庫，所以 pip 失敗時也能跑；有退避、連續次數上限、「已有後繼就不重複排」，最終失敗會送 Telegram 告警。
      # 注意：手動取消 bot 也會觸發自救（鏈會接著續下去）；要真正停掉 bot，請先在 Actions 頁面 Disable workflow 再取消。
      - name: 🔁 自救：排下一棒（失敗／取消／逾時）
        if: ${{ always() && steps.bot.outcome != 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BOT_RELAY_REF: ${{ github.event.repository.default_branch || 'master' }}
          BOT_FAIL_COUNT: ${{ github.event.inputs.handoff_fail_count }}
          BOT_JOB_STATUS: ${{ job.status }}
          # 自救最終失敗時的 Telegram 告警（只在最終失敗時才會送）；未設定則只寫 log
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f bot_relay.py ]; then
            echo "::error title=bot 自救無法執行::找不到 bot_relay.py（checkout 失敗？）。bot 沒有後繼 run，只能等 cron 備援。"
            exit 1
          fi
          python3 bot_relay.py recover
