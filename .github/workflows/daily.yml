name: 每日公司債自動抓取與 Telegram 通知

# -----------------------------------------------------------------------------
# 若 Actions 列表裡「完全沒有 Scheduled」觸發（只有手動 Run）→ 幾乎一定是 GitHub 端未跑排程，請檢查：
# 1) 本 workflow 檔在「預設分支」（本 repo：master）。
# 2) Settings → Actions → General → Actions permissions 須允許執行 workflows。
# 3) 同上頁 Workflow permissions 建議選「Read and write」（要 push reports）。
# 4) 開 Actions → 左欄點本 workflow → 若出現排程已停用（disabled），按 Enable。
# 5) 倉庫長期無活動時 GitHub 會自動暫停 scheduled workflows；任意 push 或手動 Enable 可恢復。
# 6) 排程以 UTC 為準；主排程台北 18:23（UTC 10:23）、備援台北 22:47（UTC 14:47）。
#    GitHub 排程常延遲數十分鐘到數小時，甚至整個略過（2026-09-14 就沒跑），所以才有備援那班。
#    延遲若跨過台北午夜，報告日期會自動回退為前一日（見 telegram_date_utils.report_yyyymmdd）。
# 7) 備援：若 GitHub 排程未跑，請用 PAT 觸發「workflow_dispatch」（scripts/Trigger-GitHubDailyWorkflow.ps1），
#    勿再使用 repository_dispatch：過去若曾設定 n8n/cron/雲端 POST daily-run，會在任意時間觸發發送。
# 8) 診斷：workflow「Schedule smoke test」可手動 Run 驗證 Actions；已關閉其 cron 以免混淆。
# 文件：https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
# -----------------------------------------------------------------------------

on:
  schedule:
    # 主排程：台北 18:23（UTC 10:23）。刻意避開整點 —— 整點是 GitHub 最壅塞的時段，
    # 本 repo 的延遲曾從 25 分惡化到 4 小時，2026-09-14 甚至整個 run 被丟棄。
    - cron: "23 10 * * *"
    # 備援排程：台北 19:37 / 20:53 / 22:47。GitHub 對單一班次的延遲與丟棄很不穩定
    # （主排程曾晚 9 小時，2026-10-06 兩班都沒來），所以多放幾班，只要有一班準時就夠。
    # 先成功發送的那班寫入 reports/.last_sent，其餘的 send 會因 SKIP_IF_ALREADY_SENT 略過，
    # 不會重複發 Telegram。班次延遲到台北午夜後，報告日期會自動回退為前一日。
    #
    # 注意：全部班次都必須在「當天公告大致收齊之後」（台北 18:00 以後）。若加了更早的班次，
    # 它會搶先發出一份不完整的日報並寫下標記，把之後完整的那班擋掉。
    - cron: "37 11 * * *"
    - cron: "53 12 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: |
          all = 與排程相同（抓取→commit→發送）。
          send = 只跑發送（用 repo 內 reports/，測試自動發送路徑）。
          fetch = 只抓取並 commit，不發 Telegram。
        type: choice
        options:
          - all
          - send
          - fetch
        default: all
      skip_if_sent:
        description: |
          true = 若該報告日期已成功送出（reports/.last_sent）就略過發送，不重複發 Telegram。
          bot 自動觸發每日報告時固定帶 true；手動補送請維持 false。
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

# 全域設定台灣時區，讓所有步驟的日期都一致
env:
  TZ: Asia/Taipei
  PYTHONIOENCODING: utf-8

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 每日一次仍保留佇列，避免與手動 workflow_dispatch 同時 push 衝突
    concurrency:
      group: corporate-bond-daily-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # 明確 checkout 分支最新 commit，而不是預設的「觸發當下的 github.sha」：
      # 這個 run 可能在 concurrency 佇列裡等很久，等到時 reports/.last_sent 早被前一個 run 更新了。
      # 用舊的 sha 會讓 SKIP_IF_ALREADY_SENT 讀到過期標記而重發日報。
      - name: 📥 Checkout 程式碼（分支最新）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 📌 Checkout 版本與防重發標記
        run: |
          echo "trigger_sha=${GITHUB_SHA}"
          echo "checkout_head=$(git rev-parse HEAD)"
          if [ "${GITHUB_SHA}" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::排隊期間分支已前進：本次使用較新的 checkout（防重發標記以最新為準）"
          fi
          echo ".last_sent=$(cat reports/.last_sent 2>/dev/null || echo '(無)')"

      - name: 🔎 觸發來源與時間（除錯「一直自動發送」必看）
        run: |
          echo "========== WHO FIRED THIS RUN =========="
          echo "github.event_name=${{ github.event_name }}"
          echo "github.actor=${{ github.actor }}"
          echo "github.workflow=${{ github.workflow }}"
          echo "run=${{ github.run_id }}  attempt=${{ github.run_attempt }}"
          echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "dispatch_mode=${{ github.event.inputs.mode }}"
          echo "UTC=$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "TW=$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "=========================================="
          echo "schedule = GitHub cron (primary 18:23 Taipei / backup 22:47 Taipei; GitHub may delay or skip runs)"
          echo "workflow_dispatch = manual Run, PAT script, or Windows Task Scheduler"
          echo "If sends are every few minutes: check Task Scheduler + old n8n hitting workflow API."

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # PyPI 偶發失敗會讓整個 run 起不來，所以重試；最終失敗會明確 fail。
      - name: 📦 安裝套件（含重試）
        run: bash scripts/pip_install_retry.sh requirements.txt

      # 日期解析一次就好：後續 fetch / 存檔 / send 全部吃同一個 REPORT_DATE，
      # 避免 job 執行中跨過台北午夜時，各步驟算出不同日期。
      - name: 📅 解析報告目標日期
        run: |
          RD=$(python main.py report-date)
          echo "REPORT_DATE=${RD}" >> "$GITHUB_ENV"
          echo "報告目標日期：${RD}（現在台北 $(date '+%Y-%m-%d %H:%M')）"
          if [ "${RD}" != "$(date +%Y%m%d)" ]; then
            echo "::warning::排程延遲已跨過台北午夜，報告日期回退為 ${RD}"
          fi

      # 防重發守門放在「抓取之前」：已送過的日報不該再連線 Telegram 抓一遍
      # （多一次連線就多一次 session 被撤銷的風險，也浪費 Actions 分鐘數）。
      # 這時已經過了 concurrency 排隊與「分支最新」的 checkout，所以讀到的 .last_sent 是最新的。
      # 判斷邏輯在 main.py check-sent；send 步驟內的同一個判斷仍保留當第二道防線。
      - name: 🛡️ 防重發守門（已送過就略過抓取與發送）
        id: guard
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'fetch') }}
        env:
          SKIP_IF_ALREADY_SENT: ${{ github.event_name == 'schedule' || github.event.inputs.skip_if_sent == 'true' }}
        run: python main.py check-sent

      # fetch 失敗仍繼續（用已 checkout 的 reports/complete_report_latest.txt 發送）
      - name: 📡 抓取並生成 complete_report
        id: fetch
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'send')) }}
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_NAME: ${{ secrets.TELEGRAM_CHAT_NAME }}
          # 今日 0 筆時勿用舊 CSV 填報告（曾導致 4/30 公告被重發）；僅允許最多 1 日 fallback
          TELEGRAM_FALLBACK_RECENT_WHEN_EMPTY_TODAY: "0"
          TELEGRAM_FALLBACK_RECENT_DAYS: "1"
          TELEGRAM_FALLBACK_RECENT_MAX: "2000"
          # 分頁抓今日：單日公告極多時可酌調大（注意 Actions 分鐘數與 Telegram 限流）
          TELEGRAM_FETCH_PAGE_SIZE: "400"
          TELEGRAM_FETCH_MAX_TOTAL: "25000"
          TELEGRAM_FETCH_FALLBACK_LIMIT: "8000"
        run: |
          echo "台灣時間：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          python main.py fetch

      - name: 💾 儲存報告至 reports/
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'send')) }}
        run: |
          mkdir -p reports
          REPORT="outputs/daily/complete_report_${REPORT_DATE}.txt"
          if [ -f "$REPORT" ]; then
            cp "$REPORT" "reports/complete_report_latest.txt"
            echo "✅ 已複製 ${REPORT} → reports/complete_report_latest.txt"
          else
            echo "::warning::未產生 outputs/daily/complete_report_${REPORT_DATE}.txt，不覆寫 reports/（避免把 4/30 等舊報告當最新送出）"
          fi

      # 先發送再 git push：避免 push 網路延遲／重試卡住 Telegram 10～20+ 分鐘（send 讀 runner 上檔案即可）
      - name: 🔍 發送前檢查報告檔
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'fetch')) }}
        run: |
          ls -la reports/ 2>/dev/null || echo "（無 reports 目錄）"
          ls -la outputs/daily/ 2>/dev/null || echo "（無 outputs/daily）"
          if [ -f reports/complete_report_latest.txt ]; then
            echo "✅ reports/complete_report_latest.txt 存在，約 $(wc -c < reports/complete_report_latest.txt) bytes"
          else
            echo "::warning::缺少 reports/complete_report_latest.txt，send 將依 main.py 備援路徑找檔"
          fi

      - name: 📤 傳送轉換公司債公告至 Telegram Bot
        id: send
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'fetch')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 僅在「只跑 send、未先 fetch」時可能需要；保留與 skip 搭配無妨
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_NAME: ${{ secrets.TELEGRAM_CHAT_NAME }}
          TELEGRAM_APPEND_ACTIONS_MARKER: "1"
          # 防重發：若 reports/.last_sent 已是本次 REPORT_DATE 就略過發送。
          # cron 備援一律套用；bot 自動觸發時帶 skip_if_sent=true 也套用；手動 dispatch 預設不套用，方便隨時重送。
          SKIP_IF_ALREADY_SENT: ${{ github.event_name == 'schedule' || github.event.inputs.skip_if_sent == 'true' }}
          # 僅在「本 job 已跑過 fetch」時略過 send 內二次 fetch；單獨 mode=send 時仍允許重試抓取
          SKIP_SEND_REFETCH_ON_EMPTY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'send') }}
        run: |
          echo "即將執行：python main.py send（台灣時間 $(date '+%H:%M:%S')）"
          python main.py send
          echo "### Telegram send 已執行" >> "$GITHUB_STEP_SUMMARY"
          echo "- 觸發: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- run: ${{ github.run_id }} / attempt ${{ github.run_attempt }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 台灣時間: $(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"

      # note: send 步驟會寫 reports/.last_sent，所以這步不能只在 mode != 'send' 時跑，
      # 否則備援排程的防重發標記永遠不會被提交。
      - name: 📝 Commit 報告到 GitHub
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          # 最終推送失敗時的 Telegram 告警（只在最終失敗才會送）；未設定則只有 ::error::
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          if git diff --staged --quiet; then
            echo "無變更，略過 commit"
            exit 0
          fi
          git commit -m "update: 每日報告 ${REPORT_DATE:-$(date '+%Y-%m-%d')}"
          # 每次嘗試前 pull --rebase、失敗退避重試；最終失敗 → ::error:: + Telegram 告警 + 此步驟失敗（run 變紅）
          bash scripts/push_with_retry.sh

      # 不論前面成功或失敗都輸出：這一次實際「產生」與「送出」的是哪一天的報告、結果如何。
      # 送出結果讀 main.py 寫的 send_result.txt（sent / skipped_already_sent / failed），不靠推測。
      - name: 🧾 本次結果摘要（報告日期／產生／送出）
        if: ${{ always() }}
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_IF_SENT_INPUT: ${{ github.event.inputs.skip_if_sent }}
        run: |
          RD="${REPORT_DATE:-（未解析：前面的步驟在解析日期前就失敗）}"
          REPORT_FILE="outputs/daily/complete_report_${REPORT_DATE:-none}.txt"
          if [ -f "$REPORT_FILE" ]; then
            GENERATED="是（$(wc -c < "$REPORT_FILE") bytes，$(grep -m1 '生成時間' "$REPORT_FILE" || echo '無生成時間標頭')）"
          else
            GENERATED="否（本次沒有產生 ${REPORT_FILE}）"
          fi
          SEND_RESULT="未知（沒有送出結果檔）"
          if [ -f outputs/daily/send_result.txt ]; then
            SEND_RESULT="$(cut -d' ' -f2- outputs/daily/send_result.txt | tr -d '\r\n')"
          elif [ "${SEND_OUTCOME}" = "skipped" ]; then
            SEND_RESULT="未執行（此模式不發送）"
          fi
          LAST_SENT="$(tr -d '[:space:]' < reports/.last_sent 2>/dev/null || true)"
          LAST_SENT="${LAST_SENT:-（無）}"

          echo "=============== 本次結果摘要 ==============="
          echo "報告日期（REPORT_DATE）：${RD}"
          echo "觸發事件：${EVENT_NAME}（skip_if_sent=${SKIP_IF_SENT_INPUT:-n/a}）"
          echo "抓取步驟：${FETCH_OUTCOME:-skipped}"
          echo "報告已產生：${GENERATED}"
          echo "Telegram 送出：${SEND_RESULT}（send 步驟 ${SEND_OUTCOME:-skipped}）"
          echo "reports/.last_sent：${LAST_SENT}"
          echo "============================================"

          {
            echo "### 每日報告結果"
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| 報告日期 | \`${RD}\` |"
            echo "| 觸發事件 | \`${EVENT_NAME}\` |"
            echo "| 抓取 | ${FETCH_OUTCOME:-skipped} |"
            echo "| 報告已產生 | ${GENERATED} |"
            echo "| Telegram 送出 | **${SEND_RESULT}** |"
            echo "| reports/.last_sent | \`${LAST_SENT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${SEND_RESULT%% *}" = "sent" ] && [ "${LAST_SENT}" != "${REPORT_DATE:-}" ]; then
            echo "::warning::已送出但 reports/.last_sent（${LAST_SENT}）與報告日期（${REPORT_DATE:-}）不一致，防重發標記可能有問題"
          fi

      - name: 📦 上傳每日報告（保留 30 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_number }}
          path: outputs/daily/
          retention-days: 30
          if-no-files-found: ignore
