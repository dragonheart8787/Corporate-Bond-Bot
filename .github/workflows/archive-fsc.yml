name: 留存證期局申報案件彙總表（只存檔；失敗才通知）

# run-name 在 dry_run 時帶「（dry-run）」、send_test 時帶「（管道測試）」，通知邏輯靠它把這兩類 run 排除在「前幾次 run」之外
run-name: 留存證期局申報案件彙總表${{ github.event.inputs.dry_run == 'true' && '（dry-run）' || '' }}${{ github.event.inputs.send_test == 'true' && '（管道測試）' || '' }}

# 目的：每天抓金管會證期局「申報案件辦理情形彙總表」的 115、114 兩個年度檔（有 .xlsx 用 .xlsx；115 年自 2026-10-21 起只有 .ods，改用 .ods），原檔逐位元留存，
# 並產生完整解析（parsed）、版本資訊（meta）與新舊版差異（diffs），供之後離線評估。只留存，不接進日報、不接進 /cb。
# 為什麼 114 年也要每天查：該檔在 2026 年仍會被更新，不是一次性。
#
# 請求：頁面 1 次 + 兩個年度檔各 1 次（共 ≤ 3 次），間隔 ≥ 6 秒，不跟隨轉址，不重試；連結每次從頁面解析。
# 抓取與存檔本身不使用任何 secrets、不觸發其他 workflow；唯一的寫入是把 data/fsc/ 提交回分支。
# 失敗通知：只有「🔔 失敗／恢復通知」那一個步驟會用到 Telegram secrets（與 daily.yml 告警相同的 TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID），
#   並用 github.token（actions: read）查本 workflow 前幾次 run。判斷規則見 scripts/fsc_alert.py：連續失敗第 1 次、每 6 次重發、失敗後恢復時發；
#   dry_run 不通知；test_alert=true 只把訊息印到 log、不送出。通知失敗只寫 ::warning::，不影響失敗閘門。
# 管道測試：send_test=true（只能手動 dispatch，且 dry_run=false、test_alert=false）是唯一會「真實送出一則固定測試訊息」的入口：
#   不抓取、不查詢前幾次 run、不提交、不寫檔；送訊失敗（HTTP 非 2xx、secret 缺失、chat id 錯誤、逾時）會讓 run 變紅。
#   不合法的組合在最早的步驟（任何網路請求之前）就 ::error:: 並失敗；只能在 master 分支上執行。schedule 等其他觸發不可能進入送訊。
# 資料使用條款見 data/fsc/SOURCE.md（引用須註明來源、不得任意增刪、不得商業使用）。
on:
  schedule:
    # UTC 01:29（台北 09:29）與 09:43（台北 17:43）：避開整點、:30，也避開 bot／daily／archive-announcements 已用的分鐘。
    # GitHub 排程常延遲、偶爾略過，所以兩班；腳本冪等（同一版本重跑輸出逐位元相同、沒變更就不提交），多跑沒有副作用。
    - cron: "29 1 * * *"
    - cron: "43 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 只驗證設定、印出將送出的請求，不連線、不寫檔"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_alert:
        description: "true = 只把通知訊息內容印到 log（預覽），絕不送出"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_test:
        description: "true = 管道測試：只真實送出一則固定的測試訊息到 Telegram（不抓取、不提交）；只能搭配 dry_run=false 與 test_alert=false"
        required: false
        default: false
        type: boolean

# contents: write 僅為把存檔提交回分支；actions: read 僅為通知步驟查詢本 workflow 前幾次 run 的結果。沒有 actions: write，沒有其他權限。
permissions:
  contents: write
  actions: read

concurrency:
  group: archive-fsc
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 最早的步驟（早於 checkout 與任何網路請求）：send_test 只能單獨使用。違反就失敗，後面的步驟（含通知）都不會執行。
      - name: 🧪 輸入檢查（send_test 不可與 dry_run、test_alert 並用，只能手動 dispatch，且只能在 master 上）
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TEST_ALERT: ${{ github.event.inputs.test_alert }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/master" ] || [ "$DRY_RUN" = "true" ] || [ "$TEST_ALERT" = "true" ]; then
              echo "::error title=send_test 輸入不合法::send_test=true 只能手動 dispatch、只能在 master 分支上執行，且必須搭配 dry_run=false 與 test_alert=false。沒有抓取、沒有送出任何訊息。"
              exit 1
            fi
          fi

      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 某個年度失敗也不能讓另一個年度已成功的資料白抓：腳本把成功的年度寫完、整體以非 0 結束，
      # 這裡用 continue-on-error 讓後面的提交照跑，最後再由「失敗閘門」把 run 變紅。
      - name: 🗄️ 抓取並存檔（頁面 1 + 各年度檔 1：有 .xlsx 用 .xlsx、否則用 .ods；間隔 ≥ 6 秒，不重試）
        id: archive
        if: ${{ github.event.inputs.send_test != 'true' }}
        continue-on-error: true
        env:
          ARCHIVE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PROBE_REPO: ${{ github.repository }}
        # 輸出同時存檔，給通知步驟分類失敗原因（pipefail：結束碼仍是 python 的）
        run: |
          set -o pipefail
          python3 scripts/archive_fsc.py 2>&1 | tee "$RUNNER_TEMP/archive_fsc.log"

      - name: 📝 提交存檔（pull --rebase、重試；最終失敗會讓 run 變紅）
        id: commit
        if: ${{ !cancelled() && steps.archive.outcome != 'skipped' }}
        env:
          # 不走預設的 Telegram 告警：本 workflow 不碰 Telegram，最終失敗只靠 ::error:: 與紅色 run
          PUSH_ALERT_CMD: "echo"
          PUSH_FAIL_MESSAGE: "證期局申報彙總表已抓取但 data/fsc 推送失敗。該檔仍是最新版時重跑即可補回；若期間被新版取代，舊版的差異將無法重建，請盡快手動重跑。run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 目錄可能不存在（dry_run、或所有年度都失敗而什麼都沒寫）：git add 對不存在的路徑會直接 fatal
          mkdir -p data/fsc
          git add data/fsc
          # 防呆：raw/ 內每個原始檔都必須已進索引。被 .gitignore（例如 *.xlsx）忽略時 git add 不會報錯、只會靜默略過，
          # 原檔就會隨 runner 消失；這裡讓它變成明確的 ::error:: 並中止（meta／parsed 也不提交，避免「有解析、沒原檔」的半套資料）
          if [ -d data/fsc/raw ]; then
            untracked=0
            for f in data/fsc/raw/*; do
              [ -e "$f" ] || continue
              if ! git ls-files --error-unmatch -- "$f" > /dev/null 2>&1; then
                echo "::error title=原始檔未被 git 追蹤::$f 不在索引中（可能被 .gitignore 忽略）。原始檔必須入庫，本次不提交任何 data/fsc 變更"
                untracked=1
              fi
            done
            if [ "$untracked" -ne 0 ]; then
              exit 1
            fi
          fi
          if git diff --staged --quiet; then
            echo "無變更，略過 commit"
            exit 0
          fi
          git commit -m "archive: 證期局申報彙總表 $(TZ=Asia/Taipei date +%F)"
          bash scripts/push_with_retry.sh

      # 只有這個步驟用到 secrets。continue-on-error：通知本身出任何問題都不能影響結果（程式也永遠以 0 結束，只寫 ::warning::）。
      # test_alert=true 時 secrets 被換成空字串，程式也不會呼叫 Telegram（雙重保險）；dry_run 不執行。
      # send_test 時這個步驟改為「管道測試」：continue-on-error 為 false，送訊失敗會讓 run 變紅（一般通知則永遠不影響結果）。
      - name: 🔔 失敗／恢復通知（連續失敗第 1 次、每 6 次重發、失敗後恢復；send_test 時為管道測試；dry_run 與 test_alert 不送出）
        id: notify
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: ${{ github.event.inputs.send_test != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.test_alert != 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          BOT_ALERT_CHAT_ID: ${{ github.event.inputs.test_alert != 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          GH_API_TOKEN: ${{ github.token }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          ARCHIVE_LOG: ${{ runner.temp }}/archive_fsc.log
          ARCHIVE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          ALERT_TEST: ${{ github.event.inputs.test_alert == 'true' && '1' || '0' }}
          ALERT_WORKFLOW_FILE: archive-fsc.yml
          ALERT_EVENT_NAME: ${{ github.event_name }}
          ALERT_REF: ${{ github.ref }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.event.inputs.send_test == 'true' && '1' || '0' }}
        run: python3 scripts/fsc_alert.py

      - name: 🚦 失敗閘門（抓取有任何失敗就讓 run 變紅）
        if: ${{ always() && steps.archive.outcome == 'failure' }}
        run: |
          echo "::error title=證期局申報彙總表留存有失敗::上方 [抓取並存檔] 步驟有年度失敗或結構異常，詳見其 ::error:: 訊息。成功的年度已提交。"
          exit 1
